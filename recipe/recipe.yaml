schema_version: 1

context:
  name: cloud-functions-utils
  version: 0.5.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/cloud-functions-utils-${{ version }}.tar.gz
  sha256: e773da8e00c7400a42480e2bc321304aa69730c6e4b22b63ce1d8529722020d1

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - poetry
  run:
    - google-cloud-bigquery >=1.24,<2.0
    - google-cloud-error-reporting >=1.3,<2.0
    - google-cloud-pubsub >=1.4,<2.0
    - google-cloud-storage >=1.28,<2.0
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - cloud_functions_utils
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Utilities for Google Cloud Functions.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/cloud-functions-utils/

extra:
  recipe-maintainers:
    - simstoykov
    - janjagusch
